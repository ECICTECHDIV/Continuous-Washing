<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>連續水洗能耗計算工具</title>

<!-- PWA：可安裝到手機主畫面／電腦桌面，像 App 一樣使用 -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0E7FA6">
<meta name="robots" content="noindex, nofollow">
<!-- iOS 專屬（iOS 不吃 manifest.json，要靠這幾個 meta/link 才能「加入主畫面」） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="連續水洗能耗計算工具">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">

<style>
  :root{
    --bg: #F7F6F3;
    --surface: #FFFFFF;
    --surface-alt: #F7F6F3;
    --border: #E3E1DC;
    --border-strong: #C9C6BF;
    --ink: #1C1B19;
    --ink-soft: #6B6862;
    --ink-faint: #A6A29A;
    --brand: #0E7FA6;
    --brand-dark: #0B6483;
    --brand-tint: #E4F2F7;
    --amber: #D97B2B;
    --amber-tint: #FBEFDF;
    --danger: #C8331F;
    --danger-tint: #FBEAE7;
    --good: #276749;
    --good-tint: #E9F5EE;
    --radius: 14px;
    --radius-sm: 6px;
    --radius-md: 10px;
    --font-num: "IBM Plex Mono", "Source Code Pro", ui-monospace, monospace;
    font-size: clamp(17px, 15.7px + 0.17vw, 19px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
    line-height:1.5;
    padding-bottom:64px;
  }
  .shell{max-width:clamp(760px, 90vw, 1280px);margin:0 auto;padding:0 16px;}

  header.top{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding:1rem 1rem;
  }
  @media (min-width:640px){
    header.top{padding:1.5rem 1.5rem;}
  }
  header.top .head-row{
    display:flex;
    align-items:center;
    gap:14px;
    max-width:clamp(760px, 90vw, 1280px);
    margin:0 auto;
  }
  header.top .head-accent-bar{
    flex:0 0 auto;
    align-self:stretch;
    width:4px;
    min-height:44px;
    background:var(--brand);
    border-radius:2px;
  }
  header.top .head-titles{flex:1 1 auto;min-width:0;}
  header.top h1{
    margin:0;
    font-size:1.25rem;
    font-weight:700;
    letter-spacing:-.01em;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  @media (min-width:640px){
    header.top h1{font-size:1.875rem;}
  }
  header.top .head-actions{
    display:flex;
    gap:8px;
    flex-shrink:0;
  }
  header.top .head-actions button{
    appearance:none;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--ink-soft);
    width:36px;
    height:36px;
    padding:0;
    border-radius:999px;
    font-size:.76rem;
    font-weight:600;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    white-space:nowrap;
  }
  header.top .head-actions button svg{width:17px;height:17px;}
  header.top .head-actions button:active{background:var(--bg);}
  .lang-seg-wrap{
    display:inline-flex;
    border-radius:999px;
    overflow:hidden;
    border:1.5px solid var(--brand);
    flex-shrink:0;
  }
  header.top .head-actions .lang-seg-wrap .lang-seg-btn{
    padding:7px 14px;
    font-size:.78rem;
    font-weight:700;
    background:var(--surface);
    color:var(--brand);
    border:none;
    border-radius:0;
    cursor:pointer;
  }
  header.top .head-actions .lang-seg-wrap .lang-seg-btn + .lang-seg-btn{border-left:1.5px solid var(--brand);}
  header.top .head-actions .lang-seg-wrap .lang-seg-btn.active{background:var(--brand);color:#fff;}
  .top-bar-label{
    display:block;
    font-size:.82rem;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .top-bar-slim{
    padding:1rem 1rem 0;
    margin-bottom:1.25rem;
  }
  @media (min-width:640px){
    .top-bar-slim{
      padding:1.5rem 1.5rem 0;
      margin-bottom:1.5rem;
    }
  }
  .top-bar-slim .shell{
    padding:12px 14px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
  }
  .top-bar-slim-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
  }
  @media (min-width:640px){
    .top-bar-slim-grid{
      grid-template-columns:1fr 1fr;
      gap:16px;
    }
  }
  .top-bar-slim-row{
    display:flex;
    gap:8px;
  }
  .top-bar-slim select, .top-bar-slim input[type=text]{
    flex:1 1 auto;
    min-width:0;
    padding:9px 10px;
    font-size:.9rem;
    border:1px solid var(--border-strong);
    border-radius:var(--radius-sm);
    background:#fff;
  }
  .top-bar-slim .btn-sm{
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:9px 12px;
    border-radius:var(--radius-sm);
    border:1px solid var(--brand);
    background:var(--brand);
    color:#fff;
    cursor:pointer;
  }
  .top-bar-slim .btn-sm svg{width:18px;height:18px;flex-shrink:0;}
  .top-bar-slim .btn-sm.danger{
    border-color:var(--danger);
    background:var(--danger);
    color:#fff;
  }

  nav.tabs{
    position:sticky;
    top:0;
    z-index:41;
    background:rgba(255,255,255,.98);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
    width:100%;
  }
  .tabs-inner{
    display:flex;
    gap:2px;
    max-width:clamp(760px, 90vw, 1280px);
    margin:0 auto;
    padding:0 8px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .tabs-inner::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:1 0 auto;
    appearance:none;
    border:none;
    border-bottom:3px solid transparent;
    background:none;
    color:var(--ink-soft);
    padding:10px 4px 9px;
    font-size:.78rem;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    transition:color .15s ease, border-color .15s ease;
  }
  nav.tabs button.active{
    background:none;
    color:var(--brand);
    border-bottom-color:var(--brand);
  }
  nav.tabs .tab-icon{width:19px;height:19px;display:block;}
  nav.tabs .tab-icon svg{width:100%;height:100%;display:block;}

  main{padding:1.25rem 1rem 1rem;}
  main.shell{padding-top:1.25rem;}
  @media (min-width:640px){
    main{padding:1.5rem;}
    main.shell{padding-top:1.5rem;}
  }
  .panel{display:none;}
  .panel.active{display:block;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:1.25rem;
    margin-bottom:1.25rem;
  }
  @media (min-width:640px){
    .card{
      padding:1.5rem;
      margin-bottom:1.5rem;
    }
  }
  .card h2{
    margin:0 0 0.5rem;
    font-size:1.125rem;
    font-weight:600;
    color:var(--ink);
    letter-spacing:-.01em;
  }
  @media (min-width:640px){
    .card h2{
      font-size:1.25rem;
      margin-bottom:0.625rem;
    }
  }
  .card .sub{
    margin:0 0 16px;
    color:var(--ink-soft);
    font-size:.88rem;
  }

  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:.86rem;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .row2 .field label, .row3 .field label{
    min-height:2.6em;
    display:flex;
    align-items:flex-end;
  }
  @media (max-width:480px){
    .row3{grid-template-columns:1fr 1fr;}
  }

  input[type=number], input[type=text], select, textarea{
    width:100%;
    font-size:0.875rem;
    font-weight:500;
    padding:0.625rem 0.875rem;
    border:1px solid var(--border-strong);
    border-radius:var(--radius-sm);
    background:var(--surface);
    color:var(--ink);
    font-family:inherit;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  @media (min-width:640px){
    input[type=number], input[type=text], select, textarea{
      font-size:0.9375rem;
      padding:0.75rem 1rem;
    }
  }
  input[type=number]{font-family:var(--font-num);}
  input:focus, select:focus, textarea:focus{
    outline:none;
    border-color:var(--brand);
    box-shadow:0 0 0 3px var(--brand-tint);
    background:#fff;
  }

  .btn{
    display:inline-block;
    background:var(--brand);
    color:#fff;
    border:none;
    padding:12px 20px;
    border-radius:var(--radius-sm);
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    width:100%;
  }
  .btn.secondary{
    background:var(--surface);
    color:var(--brand);
    border:1px solid var(--brand);
  }
  .add-row-btn{
    background:none;
    border:none;
    color:var(--brand);
    font-weight:600;
    font-size:.85rem;
    cursor:pointer;
    padding:4px 10px;
  }
  .add-row-btn:active{text-decoration:underline;}
  .clear-link{
    font-size:.82rem;
    color:var(--ink-soft);
    font-weight:600;
    cursor:pointer;
    background:none;
    border:none;
    padding:4px 2px;
    text-decoration:underline;
  }

  /* ---- 水洗流程：流程卡片 ---- */
  .process-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    margin-bottom:16px;
    overflow:hidden;
  }
  .process-card-header{
    display:flex;
    align-items:center;
    gap:8px;
    padding:14px 16px;
    cursor:pointer;
    background:var(--surface-alt);
  }
  .process-card-header input[type=text]{
    flex:1 1 auto;
    font-weight:700;
    border:none;
    background:none;
    padding:4px 2px;
  }
  .process-card-header input[type=text]:focus{box-shadow:none;border-bottom:2px solid var(--brand);border-radius:0;}
  .process-card-chevron{
    flex:0 0 auto;
    color:var(--ink-soft);
    transition:transform .2s;
  }
  .process-card-header.open .process-card-chevron{transform:rotate(180deg);}
  .process-card-body{padding:16px;display:none;}
  .process-card-delete{
    flex:0 0 auto;
    width:30px;height:30px;
    border-radius:50%;
    border:none;
    background:var(--danger-tint);
    color:var(--danger);
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .grp-title{
    font-size:.88rem;
    font-weight:700;
    color:var(--ink);
    margin:18px 0 8px;
    padding-bottom:4px;
    border-bottom:2px solid var(--brand-tint);
  }
  .grp-title:first-child{margin-top:0;}

  .stage-row{
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:10px;
    margin-bottom:10px;
    background:var(--surface-alt);
  }
  .stage-row .stage-row-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .stage-row-del{
    flex:0 0 auto;
    width:26px;height:26px;
    border-radius:50%;
    border:none;
    background:var(--danger-tint);
    color:var(--danger);
    font-weight:700;
    cursor:pointer;
    line-height:1;
  }
  .stage-row-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
  }
  .stage-row-grid label{
    font-size:.74rem;
    color:var(--ink-soft);
    font-weight:600;
    margin-bottom:3px;
    display:block;
  }
  .stage-row-grid input{
    font-size:.92rem;
    padding:8px;
  }
  @media (max-width:480px){
    .stage-row-grid{grid-template-columns:1fr 1fr;}
  }

  .result-num-box{
    background:var(--surface-alt);
    border-radius:var(--radius-sm);
    padding:12px 14px;
  }

  .result-data-table{width:100%;border-collapse:collapse;font-size:.86rem;}
  .result-data-table th{
    padding:8px 4px;
    font-size:.72rem;
    font-weight:700;
    color:var(--ink-soft);
    text-align:center;
    border-bottom:1px solid var(--border);
  }
  .result-data-table th:first-child{text-align:left;}
  .result-data-table td{
    padding:9px 4px;
    text-align:center;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  .result-data-table td:first-child{
    text-align:left;
    font-weight:600;
    color:var(--ink-soft);
    white-space:normal;
  }
  .result-data-table tr:last-child td{border-bottom:none;}
  .result-data-table .rdv{font-family:var(--font-num);font-weight:700;color:var(--brand);font-size:1.02em;}
  .result-data-table .rdu{color:var(--ink-faint);font-size:.82em;margin-left:2px;}

  .process-summary{
    background:var(--surface-alt);
    padding:12px 14px;
    border-radius:var(--radius-sm);
    font-size:.85rem;
    margin-bottom:12px;
  }
  .process-summary p{margin:0 0 6px;color:var(--ink-soft);}

  .units-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.8rem;}
  .units-table th, .units-table td{border:1px solid var(--border);padding:6px;text-align:center;}
  .units-table th{background:var(--surface);font-size:.72rem;color:var(--ink-soft);}
  @media screen and (max-width:600px){
    .units-table, .units-table tbody, .units-table tr, .units-table td { display:block; }
    .units-table thead { display:none; }
    .units-table tr { margin-bottom:8px; border:1px solid var(--border); border-radius:6px; padding:4px; }
    .units-table td { text-align:right; padding-left:48%; position:relative; border:none; border-bottom:1px solid var(--surface-alt); }
    .units-table td::before {
      content: attr(data-label);
      position:absolute; left:8px; width:44%; text-align:left; font-weight:600; color:var(--ink-soft);
    }
  }

    .compare-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:1.25rem;
    margin-bottom:1.25rem;
  }
  @media (min-width:640px){
    .compare-grid{
      grid-template-columns:1fr 1fr;
      gap:1.5rem;
      margin-bottom:1.5rem;
      align-items:stretch;
    }
    .compare-grid .card{
      margin-bottom:0;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      height:100%;
    }
  }

  .results-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));
    gap:16px;
    align-items:start;
  }
  .result-card{margin-bottom:0;}
  .method-text{
    font-size:.92rem;
    color:var(--ink-soft);
    line-height:1.7;
    margin:0 0 4px;
  }
  .method-list{
    margin:0 0 4px;
    padding-left:1.3em;
  }
  .method-list li{
    font-size:.92rem;
    color:var(--ink-soft);
    line-height:1.6;
    margin-bottom:6px;
  }
  .method-list li:last-child{margin-bottom:0;}

  /* ---- 響應式版面留白（≥640px 桌面版加大留白，手機維持原本緊湊排版不變）----
     只調整「留白/間距」：頁首內距、工具列外層上下留白、.shell 與分頁籤列左右內距。
     按鈕/輸入框內距、圖示大小、卡片圓角等元件本身尺寸不隨螢幕寬度改變。 */


  footer.app-footer{
    text-align:center;
    padding:20px 16px 8px;
    color:var(--ink-soft);
    font-size:.8rem;
  }
  .app-version{
    margin-top:6px;
    font-size:.72rem;
    color:var(--ink-faint);
  }
</style>
</head>
<body>

<header class="top">
  <div class="head-row">
    <span class="head-accent-bar"></span>
    <div class="head-titles">
      <h1 data-i18n="appTitle">連續水洗能耗計算工具</h1>
    </div>
    <div class="head-actions">
      <div class="lang-seg-wrap">
        <button type="button" id="langBtnZh" class="lang-seg-btn active" onclick="setLanguage('zh')">中</button>
        <button type="button" id="langBtnEn" class="lang-seg-btn" onclick="setLanguage('en')">EN</button>
      </div>
      <button type="button" id="shareBtn" onclick="shareToolUrl()" title="分享">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="top-bar-slim no-print">
  <div class="shell">
    <div class="top-bar-slim-grid">
      <div>
        <label class="top-bar-label" data-i18n="loadSetLabel">載入流程組</label>
        <div class="top-bar-slim-row">
          <select id="savedSetsSel" onchange="loadProcessSet()">
            <option value="" data-i18n="selectSetOpt">-- 選擇已儲存的流程組 --</option>
          </select>
          <button type="button" class="btn-sm danger" onclick="deleteProcessSet()" title="刪除" data-i18n-title="deleteBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          </button>
        </div>
      </div>
      <div>
        <label class="top-bar-label" data-i18n="saveSetLabel">儲存流程組</label>
        <div class="top-bar-slim-row">
          <input type="text" id="setNameInput" data-i18n-placeholder="setNamePh" placeholder="輸入流程組名稱">
          <button type="button" class="btn-sm" onclick="saveProcessSet()" title="儲存" data-i18n-title="saveBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<nav class="tabs">
  <div class="tabs-inner">
    <button class="tab-btn active" data-tab="settings">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></span>
      <span data-i18n="tabSettings">自定義</span>
    </button>
    <button class="tab-btn" data-tab="process">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l4-8 5 3 5-9 4 6"/></svg></span>

<main class="shell">

  <section class="panel active" id="panel-settings">
    <div class="card">
      <h2 data-i18n="customSettingsTitle">自定義參數設置</h2>
      <p class="sub" data-i18n="customSettingsSub">物理常數與機台設定，一般不需調整；有特殊現場條件才需要修改</p>

      <div class="field">
        <label data-i18n="heatSourceLabel">熱源選擇</label>
        <select id="s_heatSource" onchange="updateHeatSourceParams()">
          <option value="heavyOil" data-i18n="heavyOil">重油</option>
          <option value="coal" data-i18n="coal">煤炭</option>
          <option value="naturalGas" data-i18n="naturalGas">天然氣</option>
        </select>
      </div>
      <div class="row2">
        <div class="field">
          <label data-i18n="carbonFactorLabel">燃料碳排放因子 (kg CO₂/kg)</label>
          <input type="number" id="s_carbonFactor" value="3.15" step="0.01">
        </div>
        <div class="field">
          <label data-i18n="fuelHeatValueLabel">燃料熱值 (kJ/kg)</label>
          <input type="number" id="s_fuelHeatValue" value="40194" step="1">
        </div>
        <div class="field">
          <label data-i18n="electricityCarbonFactorLabel">電力碳排放因子 (kg CO₂/kWh)</label>
          <input type="number" id="s_electricityCarbonFactor" value="0.5" step="0.01">
        </div>
        <div class="field">
          <label data-i18n="steamLatentHeatLabel">蒸汽潛熱 (kJ/kg)</label>
          <input type="number" id="s_steamLatentHeat" value="2257" step="0.1">
        </div>
        <div class="field">
          <label data-i18n="boilerEfficiencyLabel">鍋爐效率 (%)</label>
          <input type="number" id="s_boilerEfficiency" value="80" min="0" max="100" step="1">
        </div>
        <div class="field">
          <label data-i18n="preheatingTimeLabel">熱機時間 (分鐘)</label>
          <input type="number" id="s_preheatingTime" value="30" min="0">
        </div>
        <div class="field">
          <label data-i18n="baseLoadPowerLabel">基本負載功率 (kW)</label>
          <input type="number" id="s_baseLoadPower" value="15" min="0" step="0.1">
        </div>
        <div class="field">
          <label data-i18n="singleDrumPowerLabel">單鼓洗滌室增量功率 (kW)</label>
          <input type="number" id="s_singleDrumPower" value="3" min="0" step="0.1">
        </div>
        <div class="field">
          <label data-i18n="doubleDrumPowerLabel">雙鼓洗滌室增量功率 (kW)</label>
          <input type="number" id="s_doubleDrumPower" value="5" min="0" step="0.1">
        </div>
        <div class="field">
          <label data-i18n="stackedWashPowerLabel">堆疊洗滌室增量功率 (kW)</label>
          <input type="number" id="s_stackedWashPower" value="7" min="0" step="0.1">
        </div>
        <div class="field">
          <label data-i18n="heatRecoveryEfficiencyLabel">熱回收效率 (%)</label>
          <input type="number" id="s_heatRecoveryEfficiency" value="30" min="0" max="100" step="1">
        </div>
        <div class="field">
          <label data-i18n="insulationFactorLabel">設備保溫係數 (0-1)</label>
          <input type="number" id="s_insulationFactor" value="0.95" min="0" max="1" step="0.01">
        </div>
      </div>

      <button type="button" class="add-row-btn" id="resetSettingsBtn" data-i18n="resetDefaultsBtn">重設為預設值</button>
    </div>
  </section>

  <section class="panel" id="panel-process">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:0;margin-bottom:0.25rem;">
      <h2 style="margin:0;font-size:1.1rem;" data-i18n="processSettingsTitle">水洗流程設定</h2>
      <button type="button" class="clear-link" id="clearProcessBtn" data-i18n="clearBtn">清除</button>
    </div>
    <div id="processList"></div>
    <button type="button" class="btn" id="addProcessBtn" data-i18n="addProcessBtn">＋ 新增水洗流程</button>
  </section>

  <section class="panel" id="panel-results">
    <div class="card">
      <h2 data-i18n="resultsTitle">計算結果</h2>
      <button type="button" class="btn" id="calcBtn" data-i18n="calcBtn">計算 / 更新結果</button>
    </div>
    <div id="resultsOutput"></div>
  </section>

  <section class="panel" id="panel-methods">
    <div class="card">
      <h2 data-i18n="methodsTitle">計算方式說明</h2>
      <div id="methodsOutput"></div>
    </div>
  </section>

</main>

<footer class="app-footer no-print">

  <div class="app-version">v2026.09.13</div>
